spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:backend_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

jwt.secret=dummy-test-secret-key-dummy-test-secret-key
jwt.expiration=28800000

nats.enabled=false
nats.url=nats://localhost:4222
nats.subject.demande-events=test.demande.events

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=dummy
spring.mail.password=dummy

app.frontend-url=http://localhost:4200
app.reset-password-token-expiration-minutes=30
app.mail.from=no-reply@example.test
app.mail.fail-on-error=false
