services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sophatel-backend:local
    container_name: sophatel-backend
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    environment:
      NATS_URL: nats://nats:4222
      # Ces deux valeurs dependent de la machine qui heberge la stack. Elles se
      # surchargent via un fichier .env a la racine du projet (non versionne) :
      #   APP_FRONTEND_URL=http://192.168.56.10:4200
      #   APP_CORS_ALLOWED_ORIGINS=http://192.168.56.10:4200
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # backend/.env pointe sur localhost:5432 pour un lancement hors Docker ;
      # dans le reseau compose la base s'atteint par le nom du service.
      DB_URL: jdbc:postgresql://postgres:5432/DB_Sophatel
      DB_USERNAME: sophatel
      DB_PASSWORD: sophatel
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: sophatel-front-end:local
    container_name: sophatel-front-end
    ports:
      - "4200:4200"
    environment:
      PORT: 4200
    depends_on:
      - backend

  nats:
    image: nats:latest
    container_name: sophatel-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    # -js : JetStream. -m 8222 : endpoint HTTP de monitoring, sans quoi le port
    # 8222 publie ci-dessus n'ecoute rien (/varz, /jsz, /connz).
    command: ["-js", "-m", "8222"]

  # Meme version majeure que la base Neon d'origine (PostgreSQL 16).
  # Le port est publie sur l'hote pour que le backend lance hors Docker
  # (mvn spring-boot:run / IDE) attaque la meme base.
  postgres:
    image: postgres:16-alpine
    container_name: sophatel-postgres
    environment:
      POSTGRES_DB: DB_Sophatel
      POSTGRES_USER: sophatel
      POSTGRES_PASSWORD: sophatel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sophatel -d DB_Sophatel"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
