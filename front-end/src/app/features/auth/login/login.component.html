<main class="login">
  <aside class="login__brand">
    <div class="login__logo">
      <span class="login__logo-mark">G</span>
      <span>GestionCongé</span>
    </div>

    <div class="login__hero">
      <p class="login__eyebrow">Congés & absences</p>
      <h1>Pilotez les congés avec clarté.</h1>
      <p>Demandes, validations, absences et soldes réunis dans une interface simple et propre.</p>
    </div>

  </aside>

  <section class="login__panel">
    <div class="login__form-wrap">
      <header class="login__header">
        <span class="login__mobile-brand">GestionCongé</span>
        <h2>Connexion</h2>
        <p>Entrez vos identifiants pour accéder à votre compte.</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="prenom.nom@entreprise.com"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <div class="field__row">
            <label for="password">Mot de passe</label>
            <a class="link" routerLink="/auth/forgot-password">Mot de passe oublié ?</a>
          </div>
          <div class="field__password">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="field__toggle"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              [attr.aria-pressed]="showPassword"
              (click)="togglePasswordVisibility()"
            >
              <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M1 12C1 12 5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M10.58 10.58A2 2 0 0012 14a2 2 0 001.42-.58M9.88 5.08A9.77 9.77 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-4.18 5.18M6.61 6.61C3.74 8.56 1 12 1 12s4 8 11 8a10.85 10.85 0 005.39-1.39" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="form__error">{{ errorMessage }}</p>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </section>
</main>
